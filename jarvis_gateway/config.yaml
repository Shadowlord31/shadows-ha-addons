name: "Jarvis Gateway"
description: "Schleuse zwischen dem Sprachassistenten Jarvis und Home Assistant - nur explizit freigegebene Entitaeten, pro Entitaet konfigurierbar"
version: "0.1.0"
slug: "jarvis_gateway"
init: false
arch:
  - amd64
  - aarch64
  - armv7
ingress: true
ingress_port: 3003
panel_icon: mdi:shield-home
panel_title: "Jarvis Gateway"
homeassistant_api: true
webui: "http://[HOST]:[PORT:3003]/"
ports:
  "3003/tcp": null
ports_description:
  "3003/tcp": "Optional: direkter API-Zugriff fuer Jarvis ueber den X-API-Token-Header auf /api/v1/*, siehe README. Ueber diesen Port ist NUR die Token-API erreichbar, die Oberflaeche laeuft ausschliesslich ueber Ingress. Standardmaessig deaktiviert."
options:
  api_token: ""
schema:
  api_token: "str?"
